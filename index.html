r como público</button><div id="err"></div><div class="loginMeta"><b>Acceso prototipo.</b><br>Los roles y filtros ya funcionan y se conservan en este navegador. Para seguridad multiusuario real, falta conectar Supabase Auth + RLS en Cloudflare.</div></form></section></div>`;document.getElementById('lf').onsubmit=x=>{x.preventDefault();let u=U.find(z=>z.e===document.getElementById('email').value.trim().toLowerCase()&&z.p===document.getElementById('pass').value);if(!u){document.getElementById('err').innerHTML='<div class="error">Correo o contraseña incorrectos.</div>';return}S.s={email:u.e,name:u.n,role:u.r};S.page='resumen';save();render()};document.getElementById('pub').onclick=()=>{S.s={email:'publico',name:'Público',role:'PUBLICO'};S.page='publico';save();render()}}
const NA=[['resumen','Resumen'],['cargas','Cargas'],['asignaciones','Asignaciones'],['revision','Revisión'],['observados','Observados'],['reportes','Reportes'],['usuarios','Usuarios'],['publico','Vista pública']],NN=[['resumen','Resumen'],['revision','Mi revisión'],['observados','Observados'],['reportes','Mis métricas']],NP=[['publico','Vista pública']];function nav(){return S.s.role==='ADMIN'?NA:S.s.role==='ANALISTA'?NN:NP}function shell(c){return `<div class="shell"><aside class="side"><div class="brand"><div class="logo">R</div><div><b>Radar Meta</b><small>Evidencia electoral</small></div></div><div class="user"><strong>${e(S.s.name)}</strong><span>${e(S.s.role)}</span><small>${e(S.s.email)}</small></div><nav>${nav().map(([id,l])=>`<button data-p="${id}" class="${S.page===id?'active':''}">${l}</button>`).join('')}</nav><div class="scope"><small>ALCANCE TESIS</small><b>Primera Entrega</b><span>4 partidos políticos</span></div></aside><main><header class="top"><div class="topL"><span>Proceso activo</span><b>Monitoreo Meta · Primera Entrega</b></div><div class="topR"><div class="search"><span>⌕</span><input id="gq" value="${e(S.f.q)}" placeholder="Buscar ID, candidato..."></div><button class="logout" id="out">Cerrar sesión</button><div class="avatar">${S.s.role==='ADMIN'?'AD':S.s.role==='ANALISTA'?'AN':'PU'}</div></div></header><div class="content">${c}</div></main></div>`}function list(){let L=S.ads.length?S.ads:[D],f=S.f,pa=S.s.role==='ANALISTA'?P.filter(x=>(S.asig[x.id]||x.a)===S.s.name).map(x=>x.n):null;return L.filter(a=>{let id=v(a,'IDENTIFICADOR DE LA BIBLIOTECA','ID_BIBLIOTECA','ID Biblioteca'),r=S.rev[id]||{},txt=[v(a,'PARTIDO'),v(a,'CANDIDATO','Candidato'),v(a,'NOMBRE_EN_PAGINA'),id,v(a,'PAGADO_POR','Pagado Por')].join(' ').toLowerCase();return !(pa&&!pa.includes(v(a,'PARTIDO')))&&(!f.q||txt.includes(f.q.toLowerCase()))&&(!f.party||v(a,'PARTIDO')===f.party)&&(!f.status||(r.estado||'PENDIENTE')===f.status)&&(!f.cl||(r.clasificacion||'')===f.cl)&&(!f.type||(r.mensaje||'')===f.type)})}function resumen(){let n=S.ads.length||1184,R=Object.values(S.rev),ok=R.filter(x=>x.estado==='VALIDADO').length,ob=R.filter(x=>x.estado==='OBSERVADO').length;return `<section><div class="hero"><div><p class="eyebrow">CENTRO DE REVISIÓN COLABORATIVA</p><h1>Monitoreo de publicidad política en Meta</h1><p>Controla el avance, distribuye la revisión y conserva el criterio humano detrás de cada clasificación.</p></div>${badge('Primera Entrega','blue')}</div><div class="metrics">${metric('Anuncios detectados',fmt(n),'Bruto Meta')}${metric('Validados',fmt(ok),'Clasificación humana')}${metric('Pendientes',fmt(Math.max(n-ok-ob,0)),'Sin revisar')}${metric('Observados',fmt(ob),'Segunda revisión')}</div><section class="panel"><div class="panelHead"><div><p class="eyebrow">AVANCE</p><h2>Distribución por partido</h2></div>${badge('4 partidos','green')}</div><div class="partyGrid">${P.map(x=>{let q=Math.round(x.t/1184*100);return `<article class="party"><div class="partyRow"><div><small>${e(S.asig[x.id]||x.a)}</small><b>${e(x.n)}</b></div><strong>${fmt(x.t)}</strong></div><div class="bar"><i style="width:${q}%"></i></div><div class="foot"><span>${q}% del total</span><span>${S.ads.length?'Datos cargados':'Pendiente de carga'}</span></div></article>`}).join('')}</div></section><div class="two"><section class="panel"><div class="panelHead"><div><p class="eyebrow">TRAZABILIDAD</p><h2>Flujo del sistema</h2></div></div><div class="flow">${['Bot local','Paquete web','Analista','Administrador','Consolidado'].map((x,i)=>`<b>${x}</b>${i<4?'<i>→</i>':''}`).join('')}</div></section><section class="panel"><div class="panelHead"><div><p class="eyebrow">CRITERIO</p><h2>Separación del gasto</h2></div></div><div class="split"><div><small>Gasto bruto Meta</small><b>Todo lo detectado</b></div><div><small>Gasto electoral validado</small><b>Directa + indirecta</b></div></div></section></div></section>`}function cargas(){return `<section><div class="hero"><div><p class="eyebrow">IMPORTADOR</p><h1>Cargar corrida del bot</h1><p>Sube PAQUETE_WEB_META_ADS_....zip. La información queda disponible para revisión y filtros.</p></div></div><input id="zip" hidden type="file" accept=".zip"><div class="drop" id="drop"><div class="upload">⇧</div><h2>Arrastra o selecciona tu ZIP</h2><p>ANUNCIOS_WEB.json · EVIDENCIAS_WEB.json · imágenes · videos · HTML</p><button class="primary" id="pick">Seleccionar paquete</button></div>${S.imp?`<div class="notice okay"><b>Paquete reconocido:</b> ${e(S.imp.name)} · ${fmt(S.imp.ads)} anuncios · ${fmt(S.imp.ev)} evidencias</div>`:''}</section>`}function asign(){return `<section><div class="hero"><div><p class="eyebrow">DISTRIBUCIÓN</p><h1>Asignaciones por partido</h1><p>Cada analista verá únicamente los partidos que le asignes.</p></div><button class="primary" id="saveA">Guardar asignaciones</button></div><section class="panel table"><table><thead><tr><th>Partido</th><th>Anuncios</th><th>Responsable</th><th>Estado</th></tr></thead><tbody>${P.map(x=>`<tr><td><b>${e(x.n)}</b></td><td>${fmt(x.t)}</td><td><select data-a="${x.id}">${['Analista 1','Analista 2','Analista 3','Analista 4'].map(a=>`<option ${(S.asig[x.id]||x.a)===a?'selected':''}>${a}</option>`).join('')}</select></td><td>${badge('ASIGNADO','green')}</td></tr>`).join('')}</tbody></table></section></section>`}function filters(){return `<div class="filters"><input data-f="q" value="${e(S.f.q)}" placeholder="Buscar candidato, ID, pagador..."><select data-f="party"><option value="">Todos los partidos</option>${P.map(x=>`<option value="${e(x.n)}" ${S.f.party===x.n?'selected':''}>${e(x.n)}</option>`).join('')}</select><select data-f="status"><option value="">Todos los estados</option>${['PENDIENTE','VALIDADO','OBSERVADO'].map(x=>`<option ${S.f.status===x?'selected':''}>${x}</option>`).join('')}</select><select data-f="cl">${C.map(([x,l])=>`<option value="${x}" ${S.f.cl===x?'selected':''}>${l}</option>`).join('')}</select><select data-f="type"><option value="">Todos los tipos</option>${T.filter(Boolean).map(x=>`<option ${S.f.type===x?'selected':''}>${x}</option>`).join('')}</select></div>`}function revision(){let L=list();if(!L.length)return `<section><div class="hero"><div><p class="eyebrow">REVISIÓN</p><h1>Sin coincidencias</h1><p>Ajusta los filtros para volver a mostrar anuncios.</p></div></div>${filters()}</section>`;S.i=Math.min(S.i,L.length-1);let a=L[S.i],id=v(a,'IDENTIFICADOR DE LA BIBLIOTECA','ID_BIBLIOTECA','ID Biblioteca'),r=S.rev[id]||{},m=[];try{let z=a.MULTIMEDIA_ITEMS_JSON;m=Array.isArray(z)?z:(z?JSON.parse(z):[])}catch{}if(!m.length)m=[{tipo:'IMAGEN'},{tipo:'IMAGEN'},{tipo:'VIDEO'}];return `<section>${filters()}<div class="filterFoot"><span>${fmt(L.length)} anuncios visibles</span><button class="ghost" id="clear">Limpiar filtros</button></div><div class="reviewTop"><div><p class="eyebrow">FICHA DE REVISIÓN</p><h1>Anuncio ${S.i+1} de ${L.length}</h1></div><div><button class="ghost" id="prev">← Anterior</button><button class="ghost" id="next">Siguiente →</button></div></div><div class="reviewGrid"><section class="panel"><div class="panelHead"><div><p class="eyebrow">DATOS EXTRAÍDOS DE META</p><h2>${e(v(a,'PARTIDO'))}</h2></div>${badge(r.estado||'PENDIENTE',r.estado==='VALIDADO'?'green':r.estado==='OBSERVADO'?'amber':'blue')}</div><div class="dataGrid">${[['Candidato','CANDIDATO','Candidato'],['Página','NOMBRE_EN_PAGINA','Candidato'],['ID Biblioteca','IDENTIFICADOR DE LA BIBLIOTECA','ID_BIBLIOTECA','ID Biblioteca'],['Pagado por','PAGADO_POR','Pagado Por'],['Fecha inicio','FECHA_INICIO','Fecha-Min'],['Fecha fin','FECHA_FIN','Fecha-Max'],['Plataformas','PLATAFORMAS'],['Gasto','GASTO','Gasto'],['Impresiones','IMPRESIONES','Impresiones']].map(([l,...k])=>`<div><small>${l}</small><b>${e(v(a,...k))}</b></div>`).join('')}</div><div class="desc"><small>Texto / descripción</small><p>${e(v(a,'DESCRIPCIÓN','DESCRIPCION'))}</p></div><a class="link" target="_blank" href="${e(v(a,'LINK_PUBLICACION','Link Publicación')==='—'?'#':v(a,'LINK_PUBLICACION','Link Publicación'))}">Abrir anuncio original en Meta ↗</a></section><section class="panel"><div class="panelHead"><div><p class="eyebrow">EVIDENCIA VISUAL</p><h2>Imágenes y videos</h2></div>${badge(m.length+' piezas','green')}</div><div class="gallery">${m.slice(0,9).map((x,i)=>`<article class="media"><div>${String(x.tipo).toUpperCase()==='VIDEO'?'▶':'▧'}</div><b>${e(x.tipo||'IMAGEN')} ${i+1}</b><small>${x.archivo_local?'Archivo local':'Evidencia registrada'}</small></article>`).join('')}</div></section></div><section class="panel classify"><div class="panelHead"><div><p class="eyebrow">CLASIFICACIÓN HUMANA</p><h2>¿Qué contiene realmente este anuncio?</h2></div></div><div class="classGrid"><label><span>Clasificación principal</span><select id="cl">${C.filter(x=>x[0]).map(([x,l])=>`<option value="${x}" ${(r.clasificacion||'PROPAGANDA_ELECTORAL_DIRECTA')===x?'selected':''}>${l}</option>`).join('')}</select></label><label><span>Tipo de mensaje</span><select id="tm">${T.filter(Boolean).map(x=>`<option ${r.mensaje===x?'selected':''}>${x}</option>`).join('')}</select></label><label><span>Promueve</span><select id="pro"><option>CANDIDATO</option><option>PARTIDO</option><option>AMBOS</option><option>NINGUNO</option></select></label><label class="wide"><span>Observación</span><textarea id="obs">${e(r.observacion||'')}</textarea></label></div><div class="actions"><button class="ok" data-st="VALIDADO">✓ Validar</button><button class="warn" data-st="OBSERVADO">⚠ Observar</button><button class="ghost" id="skip">Omitir</button></div></section></section>`}function observ(){let R=Object.values(S.rev).filter(x=>x.estado==='OBSERVADO');return `<section><div class="hero"><div><p class="eyebrow">SEGUNDA REVISIÓN</p><h1>Observados</h1><p>Casos dudosos que necesitan una verificación adicional.</p></div>${badge(R.length+' casos','amber')}</div><section class="panel table">${R.length?`<table><thead><tr><th>ID</th><th>Clasificación</th><th>Tipo</th><th>Observación</th><th>Usuario</th></tr></thead><tbody>${R.map(x=>`<tr><td>${e(x.id)}</td><td>${e(x.clasificacion)}</td><td>${e(x.mensaje)}</td><td>${e(x.observacion||'—')}</td><td>${e(x.usuario)}</td></tr>`).join('')}</tbody></table>`:'<div style="padding:50px;text-align:center;color:#71869e">Sin observados todavía.</div>'}</section></section>`}function reports(){let R=Object.values(S.rev).filter(x=>x.estado==='VALIDADO'),d=R.filter(x=>x.clasificacion==='PROPAGANDA_ELECTORAL_DIRECTA').length,i=R.filter(x=>x.clasificacion==='PROPAGANDA_ELECTORAL_INDIRECTA').length;return `<section><div class="hero"><div><p class="eyebrow">SALIDA VALIDADA</p><h1>Reportes y consolidado</h1><p>Indicadores basados en la revisión humana.</p></div><button class="primary" id="csv">Descargar revisión CSV</button></div><div class="metrics">${metric('Bruto Meta',fmt(S.ads.length||1184),'Todo lo recolectado')}${metric('Validados',fmt(R.length),'Revisión humana')}${metric('Propaganda directa',fmt(d),'Confirmada')}${metric('Propaganda indirecta',fmt(i),'Confirmada')}</div><div class="chartGrid">${P.slice(0,3).map(x=>`<article class="chart"><h3>${e(x.n)}</h3><div class="bar"><i style="width:${Math.round(x.t/611*100)}%"></i></div><small>${fmt(x.t)} anuncios detectados</small></article>`).join('')}</div></section>`}function users(){return `<section><div class="hero"><div><p class="eyebrow">CONTROL DE ACCESO</p><h1>Usuarios y roles</h1><p>Perfiles previstos para revisión colaborativa.</p></div></div><div class="users">${U.map(x=>`<article class="userCard"><strong>${e(x.n)}</strong><span>${e(x.r)}</span><small>${e(x.e)}</small></article>`).join('')}<article class="userCard"><strong>Público</strong><span>LECTURA</span><small>Solo información aprobada</small></article></div><div class="notice"><b>Nota:</b> el login actual es de prototipo local. Para seguridad real debes configurar Supabase Auth y RLS.</div></section>`}function publico(){return `<section><div class="hero"><div><p class="eyebrow">OBSERVATORIO PÚBLICO</p><h1>Publicidad política monitoreada</h1><p>Solo información aprobada y sin controles de edición.</p></div></div><div class="metrics">${metric('Partidos','4','Alcance')}${metric('Anuncios detectados','1,184','Primera Entrega')}${metric('Periodo','2026','Proceso')}${metric('Fuente','Meta','Biblioteca de anuncios')}</div><section class="panel"><div class="partyGrid">${P.map(x=>`<article class="party"><div class="partyRow"><b>${e(x.n)}</b><strong>${fmt(x.t)}</strong></div><div class="bar"><i style="width:${Math.round(x.t/611*100)}%"></i></div></article>`).join('')}</div></section></section>`}function render(){if(!S.s){login();return}if(S.s.role==='PUBLICO')S.page='publico';if(S.s.role==='ANALISTA'&&!['resumen','revision','observados','reportes'].includes(S.page))S.page='resumen';let F={resumen,cargas,asignaciones:asign,revision,observados:observ,reportes:reports,usuarios:users,publico};app.innerHTML=shell((F[S.page]||resumen)());bind()}function bind(){document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{S.page=b.dataset.p;save();render()});document.getElementById('out')?.addEventListener('click',()=>{S.s=null;save();render()});document.getElementById('gq')?.addEventListener('input',x=>{S.f.q=x.target.value;save()});document.querySelectorAll('[data-f]').forEach(x=>{let ev=x.dataset.f==='q'?'input':'change';x.addEventListener(ev,y=>{S.f[y.target.dataset.f]=y.target.value;S.i=0;save();render()})});document.getElementById('clear')?.addEventListener('click',()=>{S.f={...DEF.f};S.i=0;save();render()});document.getElementById('pick')?.addEventListener('click',x=>{x.stopPropagation();document.getElementById('zip').click()});document.getElementById('zip')?.addEventListener('change',x=>x.target.files?.[0]&&loadzip(x.target.files[0]));document.getElementById('drop')?.addEventListener('click',()=>document.getElementById('zip').click());document.getElementById('saveA')?.addEventListener('click',()=>{document.querySelectorAll('[data-a]').forEach(x=>S.asig[x.dataset.a]=x.value);save();toast('Asignaciones guardadas')});document.getElementById('prev')?.addEventListener('click',()=>{S.i=Math.max(0,S.i-1);save();render()});document.getElementById('next')?.addEventListener('click',next);document.getElementById('skip')?.addEventListener('click',next);document.querySelectorAll('[data-st]').forEach(b=>b.onclick=()=>review(b.dataset.st));document.getElementById('csv')?.addEventListener('click',csv)}function next(){let L=list();S.i=(S.i+1)%Math.max(L.length,1);save();render()}function review(st){let L=list(),a=L[S.i],id=v(a,'IDENTIFICADOR DE LA BIBLIOTECA','ID_BIBLIOTECA','ID Biblioteca');S.rev[id]={id,estado:st,clasificacion:document.getElementById('cl').value,mensaje:document.getElementById('tm').value,promueve:document.getElementById('pro').value,observacion:document.getElementById('obs').value,usuario:S.s.name,fecha:new Date().toISOString()};save();toast(st==='VALIDADO'?'Anuncio validado':'Enviado a observados',st==='VALIDADO'?'':'warn');next()}async function loadzip(f){try{let z=await JSZip.loadAsync(f),N=Object.keys(z.files),a=N.find(x=>x.endsWith('ANUNCIOS_WEB.json')),q=N.find(x=>x.endsWith('EVIDENCIAS_WEB.json'));if(!a)throw Error('No se encontró ANUNCIOS_WEB.json');S.ads=JSON.parse(await z.file(a).async('string'));S.ev=q?JSON.parse(await z.file(q).async('string')):[];S.imp={name:f.name,ads:S.ads.length,ev:S.ev.length};S.i=0;save();toast('Paquete cargado: '+S.ads.length+' anuncios');render()}catch(x){toast('No se pudo importar: '+x.message,'warn')}}function csv(){let R=Object.values(S.rev);if(!R.length){toast('Aún no hay revisiones','warn');return}let H=['id','estado','clasificacion','mensaje','promueve','observacion','usuario','fecha'],c=[H.join(','),...R.map(r=>H.map(h=>'"'+String(r[h]??'').replace(/"/g,'""')+'"').join(','))].join('\n'),b=new Blob(['\ufeff'+c],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='REVISION_META_VALIDADA.csv';a.click();URL.revokeObjectURL(a.href)}render();
</script></body></html>
