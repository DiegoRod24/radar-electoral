<!doctype html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="theme-color" content="#07111f"><title>Radar Meta · Evidencia electoral</title><style>:root{font-family:Inter,system-ui,sans-serif;color:#edf3fa;background:#06101b}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 85% 0,#102d51 0,#081522 34%,#06101b 100%)}button,select,textarea{font:inherit}.shell{display:grid;grid-template-columns:240px 1fr;min-height:100vh}.side{padding:20px 14px;border-right:1px solid #1b2d43;background:#07111dcc;position:sticky;top:0;height:100vh}.brand{display:flex;gap:10px;align-items:center;margin-bottom:22px}.logo{width:42px;height:42px;border-radius:13px;background:linear-gradient(145deg,#247fff,#6eabff);display:grid;place-items:center;font-weight:900}.brand b,.brand small{display:block}.brand small{color:#71859e}nav{display:grid;gap:6px}nav button{border:0;background:transparent;color:#91a3b9;border-radius:10px;padding:11px 12px;text-align:left;cursor:pointer}nav button.active,nav button:hover{background:#13243a;color:#fff}.scope{position:absolute;left:14px;right:14px;bottom:18px;border:1px solid #1f334b;border-radius:13px;padding:13px;background:#0b1726}.scope small,.scope b,.scope span{display:block}.scope small{color:#5f9fff;font-weight:900}.scope span{color:#74879f;font-size:11px;margin-top:4px}.top{height:70px;position:sticky;top:0;display:flex;align-items:center;justify-content:space-between;padding:0 26px;border-bottom:1px solid #17283d;background:#091522e8}.top span{color:#72869e;font-size:12px}.avatar{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:#203852;font-size:11px;font-weight:900}.content{padding:28px;max-width:1450px;margin:auto}.hero{display:flex;justify-content:space-between;gap:22px;align-items:flex-end;margin-bottom:22px}.eyebrow{color:#5f9fff;font-size:11px;letter-spacing:.12em;font-weight:900}.hero h1{font-size:32px;margin:5px 0 8px}.hero p{color:#91a4ba;line-height:1.6;max-width:850px;margin:0}.badge{display:inline-flex;padding:5px 9px;border-radius:999px;background:#12345e;color:#73adff;font-size:11px;font-weight:850}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}.metric,.panel{border:1px solid #1d3047;background:linear-gradient(180deg,#0d1b2c,#091725);border-radius:16px}.metric{padding:17px}.metric span,.metric small{display:block}.metric span{color:#8195ad;font-size:12px}.metric strong{display:block;font-size:28px;margin:7px 0 2px}.metric small{color:#61758d}.panel{padding:19px}.partygrid{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-top:16px}.party{border:1px solid #20364f;background:#091624;border-radius:13px;padding:14px}.partyrow{display:flex;justify-content:space-between;gap:15px}.partyrow small,.partyrow b{display:block}.partyrow small{color:#687e98}.bar{height:7px;border-radius:99px;background:#182b41;margin:12px 0 7px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#2f7df5,#74adff)}.foot{display:flex;justify-content:space-between;color:#687e98;font-size:11px}.drop{min-height:320px;border:1px dashed #365a7e;border-radius:18px;background:#0a1828;display:grid;place-items:center;align-content:center;text-align:center;padding:35px}.drop h2{margin:10px 0}.drop p{color:#758ba4}.primary,.ghost,.ok,.warn{border:0;border-radius:10px;padding:10px 14px;font-weight:800;cursor:pointer}.primary{background:#2f7df5;color:#fff}.ghost{background:#13243a;color:#b9c9dc}.ok{background:#14815a;color:#fff}.warn{background:#9c6a17;color:#fff}.reviewgrid{display:grid;grid-template-columns:.9fr 1.1fr;gap:14px}.data{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}.data div{border:1px solid #1d3149;background:#091624;border-radius:9px;padding:9px}.data small,.data b{display:block}.data small{color:#71879f;font-size:10px}.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:12px}.media{min-height:130px;border:1px solid #233b57;border-radius:11px;background:#0a1523;display:grid;place-items:center;align-content:center}.media div{font-size:32px;color:#64a3fa}.classify{margin-top:14px}.classgrid{display:grid;grid-template-columns:1fr 1fr;gap:11px}.classgrid label span{display:block;color:#7489a2;font-size:11px;margin-bottom:5px}.classgrid select,.classgrid textarea{width:100%;border:1px solid #29435f;background:#0b1929;color:#dce7f4;border-radius:9px;padding:8px}.classgrid textarea{min-height:90px}.wide{grid-column:1/-1}.actions{display:flex;gap:9px;margin-top:12px}.hidden{display:none}@media(max-width:900px){.shell{grid-template-columns:80px 1fr}.brand div:last-child,.scope{display:none}nav button{font-size:0;text-align:center}.metrics{grid-template-columns:1fr 1fr}.reviewgrid{grid-template-columns:1fr}}@media(max-width:650px){.shell{display:block}.side{height:auto;position:static}.side nav{display:flex;overflow:auto}.content{padding:16px}.hero{align-items:flex-start;flex-direction:column}.metrics,.partygrid,.classgrid{grid-template-columns:1fr}}</style></head><body><div id="app"></div><script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script><script>const P=[['PODEMOS PERÚ',611,'Analista 1'],['ALIANZA PARA EL PROGRESO',394,'Analista 2'],['PARTIDO RENOVACIÓN POPULAR',101,'Analista 3'],['PARTIDO DEMOCRÁTICO SOMOS PERÚ',78,'Analista 4']];const S={page:'resumen',ads:[],rev:{},i:0};const app=document.getElementById('app');const fmt=n=>new Intl.NumberFormat('es-PE').format(n||0);function shell(c){return `<div class="shell"><aside class="side"><div class="brand"><div class="logo">R</div><div><b>Radar Meta</b><small>Evidencia electoral</small></div></div><nav>${[['resumen','Resumen'],['cargas','Cargas'],['asignaciones','Asignaciones'],['revision','Revisión'],['observados','Observados'],['reportes','Reportes'],['usuarios','Usuarios'],['publico','Vista pública']].map(x=>`<button data-p="${x[0]}" class="${S.page===x[0]?'active':''}">${x[1]}</button>`).join('')}</nav><div class="scope"><small>ALCANCE TESIS</small><b>Primera Entrega</b><span>4 partidos políticos</span></div></aside><main><header class="top"><div><span>Proceso activo · </span><b>Monitoreo Meta</b></div><div class="avatar">AD</div></header><div class="content">${c}</div></main></div>`}function metrics(){let r=Object.values(S.rev),v=r.filter(x=>x.estado==='VALIDADO').length,o=r.filter(x=>x.estado==='OBSERVADO').length,t=S.ads.length||1184;return `<div class="metrics">${[['Anuncios detectados',t,'Bruto Meta'],['Validados',v,'Revisión humana'],['Pendientes',Math.max(t-v-o,0),'Sin revisar'],['Observados',o,'Segunda revisión']].map(x=>`<article class="metric"><span>${x[0]}</span><strong>${fmt(x[1])}</strong><small>${x[2]}</small></article>`).join('')}</div>`}function resumen(){return `<div class="hero"><div><p class="eyebrow">CENTRO DE REVISIÓN COLABORATIVA</p><h1>Monitoreo de publicidad política en Meta</h1><p>Sube la evidencia del bot, reparte los partidos y valida qué anuncios corresponden realmente a propaganda electoral.</p></div><span class="badge">Primera Entrega</span></div>${metrics()}<section class="panel"><h2>Distribución por partido político</h2><div class="partygrid">${P.map(p=>{let q=Math.round(p[1]/1184*100);return `<article class="party"><div class="partyrow"><div><small>${p[2]}</small><b>${p[0]}</b></div><strong>${p[1]}</strong></div><div class="bar"><i style="width:${q}%"></i></div><div class="foot"><span>${q}% del total</span><span>Pendiente</span></div></article>`}).join('')}</div></section>`}function cargas(){return `<div class="hero"><div><p class="eyebrow">IMPORTADOR</p><h1>Cargar corrida del bot</h1><p>Selecciona el PAQUETE_WEB_META_ADS_....zip generado por la v3.8.</p></div></div><input id="zip" type="file" accept=".zip" hidden><div class="drop" id="drop"><div style="font-size:38px;color:#6ba8ff">⇧</div><h2>Arrastra o selecciona tu ZIP</h2><p>ANUNCIOS_WEB.json · EVIDENCIAS_WEB.json · imágenes · videos · HTML · metadata</p><button class="primary" id="pick">Seleccionar paquete</button></div>${S.ads.length?`<p style="color:#7ee2ac">Paquete cargado: ${S.ads.length} anuncios.</p>`:''}`}function asignaciones(){return `<div class="hero"><div><p class="eyebrow">DISTRIBUCIÓN</p><h1>Asignaciones por partido</h1><p>Distribuye cada partido entre los analistas.</p></div></div><section class="panel">${P.map(p=>`<div style="display:grid;grid-template-columns:1fr 110px 180px;gap:10px;padding:12px;border-bottom:1px solid #1d3047"><b>${p[0]}</b><span>${p[1]} anuncios</span><select><option>${p[2]}</option><option>Analista 1</option><option>Analista 2</option><option>Analista 3</option><option>Analista 4</option></select></div>`).join('')}</section>`}const D={PARTIDO:'PODEMOS PERÚ',CANDIDATO:'JOSÉ LEÓN LUNA GÁLVEZ',NOMBRE_EN_PAGINA:'José Luna Gálvez','IDENTIFICADOR DE LA BIBLIOTECA':'DEMO-123456789',PAGADO_POR:'Podemos Perú',FECHA_INICIO:'14/03/2026',FECHA_FIN:'18/03/2026',PLATAFORMAS:'Facebook · Instagram',GASTO:'S/ 500 - S/ 699',IMPRESIONES:'10 mil - 15 mil','DESCRIPCIÓN':'Ejemplo visual. Al cargar el ZIP aparecerán los datos reales extraídos por el bot.',LINK_PUBLICACION:'https://www.facebook.com/ads/library/'};function g(a,k){return a[k]??'—'}function revision(){let L=S.ads.length?S.ads:[D],a=L[S.i%L.length];return `<div class="hero"><div><p class="eyebrow">FICHA DE REVISIÓN</p><h1>Anuncio ${S.i+1} de ${L.length}</h1></div><button class="ghost" id="next">Siguiente →</button></div><div class="reviewgrid"><section class="panel"><h2>${g(a,'PARTIDO')}</h2><div class="data">${[['Candidato','CANDIDATO'],['Página','NOMBRE_EN_PAGINA'],['ID Biblioteca','IDENTIFICADOR DE LA BIBLIOTECA'],['Pagado por','PAGADO_POR'],['Fecha inicio','FECHA_INICIO'],['Fecha fin','FECHA_FIN'],['Plataformas','PLATAFORMAS'],['Gasto','GASTO'],['Impresiones','IMPRESIONES']].map(x=>`<div><small>${x[0]}</small><b>${g(a,x[1])}</b></div>`).join('')}</div><p>${g(a,'DESCRIPCIÓN')}</p><a href="${g(a,'LINK_PUBLICACION')}" target="_blank" style="color:#68a8ff">Abrir anuncio original en Meta ↗</a></section><section class="panel"><h2>Evidencia visual</h2><div class="gallery"><article class="media"><div>▧</div><b>Imagen 1</b></article><article class="media"><div>▧</div><b>Imagen 2</b></article><article class="media"><div>▶</div><b>Video</b></article></div></section></div><section class="panel classify"><h2>Clasificación humana</h2><div class="classgrid"><label><span>Clasificación</span><select id="cl"><option>PROPAGANDA_ELECTORAL_DIRECTA</option><option>PROPAGANDA_ELECTORAL_INDIRECTA</option><option>PUBLICIDAD_POLITICA_NO_ELECTORAL</option><option>INSTITUCIONAL_PARTIDARIA</option><option>PERSONAL</option><option>INFORMATIVO</option><option>NO_CORRESPONDE</option><option>REQUIERE_REVISION</option></select></label><label><span>Tipo de mensaje</span><select id="tm"><option>PROPUESTA</option><option>IMAGEN_PERSONAL</option><option>EVENTO</option><option>GESTION</option><option>ATAQUE_CONTRASTE</option><option>OTRO</option></select></label><label class="wide"><span>Observación</span><textarea id="ob"></textarea></label></div><div class="actions"><button class="ok" data-st="VALIDADO">✓ Validar</button><button class="warn" data-st="OBSERVADO">⚠ Observar</button></div></section>`}function simple(t,p){return `<div class="hero"><div><p class="eyebrow">RADAR META</p><h1>${t}</h1><p>${p}</p></div></div><section class="panel" style="min-height:350px;display:grid;place-items:center;color:#71869e">Módulo preparado para conectar con Supabase y evidencias reales.</section>`}function page(){let f={resumen,cargas,asignaciones,revision,observados:()=>simple('Observados','Casos dudosos o incompletos para segunda revisión.'),reportes:()=>simple('Reportes y consolidado','Separará bruto Meta vs propaganda electoral validada.'),usuarios:()=>simple('Usuarios y roles','Administrador, analista y público.'),publico:()=>simple('Vista pública','Solo información aprobada, sin controles de edición.')};app.innerHTML=shell((f[S.page]||resumen)());bind()}function bind(){document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{S.page=b.dataset.p;page()});document.getElementById('pick')?.addEventListener('click',e=>{e.stopPropagation();document.getElementById('zip').click()});document.getElementById('zip')?.addEventListener('change',e=>load(e.target.files[0]));document.getElementById('drop')?.addEventListener('click',()=>document.getElementById('zip').click());document.getElementById('next')?.addEventListener('click',()=>{S.i=(S.i+1)%Math.max(S.ads.length,1);page()});document.querySelectorAll('[data-st]').forEach(b=>b.onclick=()=>{let a=(S.ads.length?S.ads:[D])[S.i%Math.max(S.ads.length,1)],id=g(a,'IDENTIFICADOR DE LA BIBLIOTECA');S.rev[id]={estado:b.dataset.st,clasificacion:document.getElementById('cl').value,mensaje:document.getElementById('tm').value,observacion:document.getElementById('ob').value};S.i=(S.i+1)%Math.max(S.ads.length,1);page()})}async function load(file){try{if(!file)return;if(!window.JSZip)throw Error('Lector ZIP no disponible');let z=await JSZip.loadAsync(file),n=Object.keys(z.files),p=n.find(x=>x.endsWith('ANUNCIOS_WEB.json'));if(!p)throw Error('No encontré ANUNCIOS_WEB.json');S.ads=JSON.parse(await z.file(p).async('string'));page()}catch(e){alert('No se pudo importar: '+e.message)}}page();</script></body></html>
