 Analista2026!<br><br>Estas cuentas son de interfaz. La autenticación real quedará en Supabase Auth.</div></form></section></div>`;document.getElementById('loginForm').onsubmit=e=>{e.preventDefault();const email=document.getElementById('email').value.toLowerCase().trim();const pass=document.getElementById('password').value;const u=USERS.find(x=>x.email===email&&x.pass===pass);if(!u){document.getElementById('loginError').innerHTML='<div class="error">Correo o contraseña incorrectos.</div>';return}S.session={email:u.email,name:u.name,role:u.role};S.page='resumen';audit('Inicio de sesión');save();render()};document.getElementById('publicBtn').onclick=()=>{S.session={email:'publico',name:'Público',role:'PUBLICO'};S.page='publico';save();render()}}
const navA=[['resumen','◫','Resumen'],['cargas','⇧','Cargas'],['asignaciones','↔','Asignaciones'],['revision','✓','Revisión'],['observados','⚠','Observados'],['reportes','▥','Reportes'],['usuarios','◉','Usuarios'],['auditoria','⌁','Auditoría'],['publico','◎','Vista pública']];const navN=[['resumen','◫','Resumen'],['revision','✓','Mi revisión'],['observados','⚠','Observados'],['reportes','▥','Mis métricas']];const navP=[['publico','◎','Vista pública']];function nav(){return S.session?.role==='ADMIN'?navA:S.session?.role==='ANALISTA'?navN:navP}
function shell(c){return `<div class="shell"><aside class="sidebar"><div class="brand"><div class="logo">R</div><div><b>Radar Meta</b><small>Evidencia electoral</small></div></div><div class="sideUser"><strong>${esc(S.session.name)}</strong><span>${esc(S.session.role)}</span><small>${esc(S.session.email)}</small></div><nav>${nav().map(([id,ic,l])=>`<button data-page="${id}" class="${S.page===id?'active':''}"><i class="ni">${ic}</i>${l}<i class="dot ${id==='observados'?'alert':''}"></i></button>`).join('')}</nav><div class="scope"><small>ALCANCE TESIS</small><b>Primera Entrega</b><span>4 partidos políticos</span></div></aside><main><header class="topbar"><div><span>Proceso activo</span><b>Monitoreo Meta · Primera Entrega</b></div><div class="topActions"><div class="search"><span>⌕</span><input id="globalSearch" value="${esc(S.filters.q||'')}" placeholder="Buscar ID, candidato, partido..."></div><button class="logout" id="logout">Cerrar sesión</button><div class="avatar">${S.session.role==='ADMIN'?'AD':S.session.role==='ANALISTA'?'AN':'PU'}</div></div></header><div class="content">${c}</div></main></div>`}
function list(){let L=S.ads.length?S.ads:[DEMO];const f=S.filters;const allowed=S.session.role==='ANALISTA'?PARTIDOS.filter(p=>(S.assignments[p.id]||p.analista)===S.session.name).map(p=>p.nombre):null;return L.filter(a=>{const id=val(a,'IDENTIFICADOR DE LA BIBLIOTECA','ID_BIBLIOTECA','ID Biblioteca');const r=S.reviews[id]||{};const text=[val(a,'PARTIDO'),val(a,'CANDIDATO','Candidato'),val(a,'NOMBRE_EN_PAGINA'),id,val(a,'PAGADO_POR','Pagado Por')].join(' ').toLowerCase();if(allowed&&!allowed.includes(val(a,'PARTIDO')))return false;if(f.q&&!text.includes(f.q.toLowerCase()))return false;if(f.party&&val(a,'PARTIDO')!==f.party)return false;if(f.status&&(r.estado||'PENDIENTE')!==f.status)return false;if(f.classification&&(r.clasificacion||'')!==f.classification)return false;if(f.message&&(r.mensaje||'')!==f.message)return false;return true})}
function resumen(){const total=S.ads.length||1184,R=Object.values(S.reviews),v=R.filter(x=>x.estado==='VALIDADO').length,o=R.filter(x=>x.estado==='OBSERVADO').length,p=Math.max(total-v-o,0);return `<section><div class="hero"><div><p class="eyebrow">CENTRO DE REVISIÓN COLABORATIVA</p><h1>Monitoreo de publicidad política en Meta</h1><p>Controla avance, asignaciones, evidencia, clasificación humana y trazabilidad desde un único tablero.</p></div>${badge('Primera Entrega','blue')}</div><div class="metrics">${metric('Anuncios detectados',fmt(total),'Bruto recolectado por Meta')}${metric('Validados',fmt(v),'Clasificación humana')}${metric('Pendientes',fmt(p),'Aún sin revisar')}${metric('Observados',fmt(o),'Segunda revisión')}</div><section class="panel"><div class="panelHead"><div><p class="kicker">AVANCE</p><h2>Distribución por partido político</h2></div>${badge('4 partidos','green')}</div><div class="partyGrid">${PARTIDOS.map(x=>{const q=Math.round(x.total/1184*100),a=S.assignments[x.id]||x.analista;return `<article class="party"><div class="partyRow"><div><small>${esc(a)}</small><b>${esc(x.nombre)}</b></div><strong>${fmt(x.total)}</strong></div><div class="bar"><i style="width:${q}%"></i></div><div class="partyFoot"><span>${q}% del total</span><span>${S.ads.length?'Carga activa':'Esperando paquete'}</span></div></article>`}).join('')}</div></section><div class="twoCol"><section class="panel"><div class="panelHead"><div><p class="kicker">TRAZABILIDAD</p><h2>Cadena del sistema</h2></div></div><div class="flow">${['Bot local','Paquete web','Analista','Administrador','Consolidado'].map((x,i)=>`<b>${x}</b>${i<4?'<i>→</i>':''}`).join('')}</div></section><section class="panel"><div class="panelHead"><div><p class="kicker">CRITERIO</p><h2>Separación del gasto</h2></div></div><div class="split"><div><small>Gasto bruto Meta</small><b>Todo lo detectado</b></div><div><small>Gasto electoral validado</small><b>Directa + indirecta</b></div></div></section></div></section>`}
function cargas(){return `<section><div class="hero"><div><p class="eyebrow">IMPORTADOR</p><h1>Cargar corrida del bot</h1><p>Sube el PAQUETE_WEB_META_ADS_....zip y conviértelo en una bandeja de revisión filtrable.</p></div></div><input id="zip" hidden type="file" accept=".zip"><div class="dropzone" id="drop"><div class="uploadIcon">⇧</div><h2>Arrastra o selecciona tu ZIP</h2><p>ANUNCIOS_WEB.json · EVIDENCIAS_WEB.json · imágenes · videos · HTML · metadata</p><button class="primary" id="pick">Seleccionar paquete</button></div>${S.importInfo?`<div class="notice ok"><b>Paquete reconocido</b><span>${esc(S.importInfo.name)} · ${fmt(S.importInfo.ads)} anuncios · ${fmt(S.importInfo.evidence)} evidencias</span></div>`:''}</section>`}
function asignaciones(){return `<section><div class="hero"><div><p class="eyebrow">DISTRIBUCIÓN</p><h1>Asignaciones por partido</h1><p>Cada analista verá únicamente los partidos que le hayas asignado.</p></div><button class="primary" id="saveAssign">Guardar asignaciones</button></div><section class="panel tableWrap"><table class="dataTable"><thead><tr><th>Partido</th><th>Anuncios</th><th>Responsable</th><th>Estado</th></tr></thead><tbody>${PARTIDOS.map(p=>`<tr><td><b>${esc(p.nombre)}</b></td><td>${fmt(p.total)}</td><td><select data-assign="${p.id}">${['Analista 1','Analista 2','Analista 3','Analista 4'].map(a=>`<option ${((S.assignments[p.id]||p.analista)===a)?'selected':''}>${a}</option>`).join('')}</select></td><td>${badge('ASIGNADO','green')}</td></tr>`).join('')}</tbody></table></section></section>`}
function filters(){return `<div class="filterBar"><input data-filter="q" value="${esc(S.filters.q)}" placeholder="Buscar candidato, ID, pagador..."><select data-filter="party"><option value="">Todos los partidos</option>${PARTIDOS.map(p=>`<option value="${esc(p.nombre)}" ${S.filters.party===p.nombre?'selected':''}>${esc(p.nombre)}</option>`).join('')}</select><select data-filter="status"><option value="">Todos los estados</option>${['PENDIENTE','VALIDADO','OBSERVADO'].map(x=>`<option ${S.filters.status===x?'selected':''}>${x}</option>`).join('')}</select><select data-filter="classification">${CL.map(([v,l])=>`<option value="${v}" ${S.filters.classification===v?'selected':''}>${l}</option>`).join('')}</select><select data-filter="message"><option value="">Todos los tipos</option>${MSG.filter(Boolean).map(x=>`<option ${S.filters.message===x?'selected':''}>${x}</option>`).join('')}</select></div>`}
function revision(){const L=list();if(!L.length)return `<section><div class="hero"><div><p class="eyebrow">FICHA DE REVISIÓN</p><h1>Sin coincidencias</h1><p>Ajusta los filtros para volver a mostrar anuncios.</p></div></div>${filters()}<section class="panel" style="text-align:center;padding:60px;color:#7489a2">No hay registros que coincidan con los filtros activos.</section></section>`;S.reviewIndex=Math.min(S.reviewIndex,L.length-1);const a=L[S.reviewIndex],id=val(a,'IDENTIFICADOR DE LA BIBLIOTECA','ID_BIBLIOTECA','ID Biblioteca'),cur=S.reviews[id]||{};let media=[];try{const raw=a.MULTIMEDIA_ITEMS_JSON;media=Array.isArray(raw)?raw:(raw?JSON.parse(raw):[])}catch{}if(!media.length)media=[{tipo:'IMAGEN'},{tipo:'IMAGEN'},{tipo:'VIDEO'}];return `<section>${filters()}<div class="filterSummary"><span>${fmt(L.length)} anuncios visibles</span><button class="ghost" id="clear">Limpiar filtros</button></div><div class="reviewTop"><div><p class="eyebrow">FICHA DE REVISIÓN</p><h1>Anuncio ${S.reviewIndex+1} de ${L.length}</h1></div><div><button class="ghost" id="prev">← Anterior</button><button class="ghost" id="next">Siguiente →</button></div></div><div class="reviewGrid"><section class="panel"><div class="panelHead"><div><p class="kicker">DATOS EXTRAÍDOS DE META</p><h2>${esc(val(a,'PARTIDO'))}</h2></div>${badge(cur.estado||'PENDIENTE',cur.estado==='VALIDADO'?'green':cur.estado==='OBSERVADO'?'amber':'blue')}</div><div class="dataGrid">${[['Candidato','CANDIDATO','Candidato'],['Cuenta / página','NOMBRE_EN_PAGINA','Candidato'],['ID Biblioteca','IDENTIFICADOR DE LA BIBLIOTECA','ID_BIBLIOTECA','ID Biblioteca'],['Pagado por','PAGADO_POR','Pagado Por'],['Fecha inicio','FECHA_INICIO','Fecha-Min'],['Fecha fin','FECHA_FIN','Fecha-Max'],['Plataformas','PLATAFORMAS'],['Gasto','GASTO','Gasto'],['Impresiones','IMPRESIONES','Impresiones']].map(([l,...k])=>`<div><small>${l}</small><b>${esc(val(a,...k))}</b></div>`).join('')}</div><div class="desc"><small>Texto / descripción</small><p>${esc(val(a,'DESCRIPCIÓN','DESCRIPCION'))}</p></div><a class="metaLink" target="_blank" rel="noreferrer" href="${esc(val(a,'LINK_PUBLICACION','Link Publicación')==='—'?'#':val(a,'LINK_PUBLICACION','Link Publicación'))}">Abrir anuncio original en Meta ↗</a></section><section class="panel"><div class="panelHead"><div><p class="kicker">EVIDENCIA VISUAL</p><h2>Imágenes y videos</h2></div>${badge(`${media.length} piezas`,'green')}</div><div class="gallery">${media.slice(0,9).map((m,i)=>`<article class="media ${String(m.tipo).toUpperCase()==='VIDEO'?'video':''}"><div>${String(m.tipo).toUpperCase()==='VIDEO'?'▶':'▧'}</div><b>${esc(m.tipo||'IMAGEN')} ${i+1}</b><small>${m.archivo_local?'Archivo local':'Evidencia registrada'}</small></article>`).join('')}</div><p class="hint">La galería queda preparada para renderizar los archivos reales del paquete cuando conectemos Storage/R2.</p></section></div><section class="panel classify"><div class="panelHead"><div><p class="kicker">CLASIFICACIÓN HUMANA</p><h2>¿Qué contiene realmente este anuncio?</h2></div></div><div class="classGrid"><label><span>Clasificación principal</span><select id="classification">${CL.filter(x=>x[0]).map(([v,l])=>`<option value="${v}" ${(cur.clasificacion||'PROPAGANDA_ELECTORAL_DIRECTA')===v?'selected':''}>${l}</option>`).join('')}</select></label><label><span>Tipo de mensaje</span><select id="message">${MSG.filter(Boolean).map(x=>`<option ${cur.mensaje===x?'selected':''}>${x}</option>`).join('')}</select></label><label><span>Promueve</span><select id="promueve"><option>CANDIDATO</option><option>PARTIDO</option><option>AMBOS</option><option>NINGUNO</option></select></label><label><span>¿Llamado electoral?</span><select id="llamado"><option>SI</option><option>NO</option><option>DUDOSO</option></select></label><label><span>Calidad de evidencia</span><select id="quality"><option>COMPLETA</option><option>PARCIAL</option><option>INCOMPLETA</option><option>ENLACE_CAIDO</option></select></label><label><span>Motivo de observación</span><select id="motivo"><option value="">Sin observación</option><option>CONTENIDO_AMBIGUO</option><option>VIDEO_NO_DISPONIBLE</option><option>IMAGEN_FALTANTE</option><option>PAGADOR_DUDOSO</option><option>CANDIDATO_NO_COINCIDE</option><option>ENLACE_ROTO</option><option>OTRO</option></select></label><label class="wide"><span>Observación del analista</span><textarea id="note" placeholder="Justifica la clasificación o indica qué debe revisar el administrador.">${esc(cur.observacion||'')}</textarea></label></div><div class="actions"><button class="good" data-status="VALIDADO">✓ Validar</button><button class="warn" data-status="OBSERVADO">⚠ Observar</button><button class="ghost" id="skip">Omitir por ahora</button></div></section></section>`}
function observados(){const R=Object.values(S.reviews).filter(x=>x.estado==='OBSERVADO');return `<section><div class="hero"><div><p class="eyebrow">SEGUNDA REVISIÓN</p><h1>Observados</h1><p>Casos dudosos o incompletos que necesitan verificación adicional.</p></div>${badge(`${R.length} casos`,'amber')}</div><section class="panel tableWrap">${R.length?`<table class="dataTable"><thead><tr><th>ID</th><th>Clasificación</th><th>Tipo</th><th>Motivo</th><th>Analista</th><th>Observación</th></tr></thead><tbody>${R.map(r=>`<tr><td>${esc(r.id)}</td><td>${esc(r.clasificacion)}</td><td>${esc(r.mensaje)}</td><td>${esc(r.motivo||'—')}</td><td>${esc(r.usuario||'—')}</td><td>${esc(r.observacion||'—')}</td></tr>`).join('')}</tbody></table>`:'<div style="padding:55px;text-align:center;color:#71869e">Todavía no hay anuncios observados.</div>'}</section></section>`}
function reportes(){const R=Object.values(S.reviews).filter(x=>x.estado==='VALIDADO'),d=R.filter(x=>x.clasificacion==='PROPAGANDA_ELECTORAL_DIRECTA').length,i=R.filter(x=>x.clasificacion==='PROPAGANDA_ELECTORAL_INDIRECTA').length;return `<section><div class="hero"><div><p class="eyebrow">SALIDA VALIDADA</p><h1>Reportes y consolidado</h1><p>Distingue el bruto de Meta del universo confirmado por revisión humana.</p></div><button class="primary" id="csv">Descargar revisión CSV</button></div><div class="metrics">${metric('Bruto Meta',fmt(S.ads.length||1184),'Todo lo recolectado')}${metric('Validados',fmt(R.length),'Revisión humana')}${metric('Propaganda directa',fmt(d),'Confirmada')}${metric('Propaganda indirecta',fmt(i),'Confirmada')}</div><section class="panel"><div class="panelHead"><div><p class="kicker">INDICADORES</p><h2>Resumen visual</h2></div></div><div class="charts">${PARTIDOS.slice(0,3).map(p=>`<article class="chartCard"><h3>${esc(p.nombre)}</h3><div class="miniBars"><div><span><b>Anuncios</b><b>${p.total}</b></span><i style="width:${Math.round(p.total/611*100)}%"></i></div><div><span><b>Revisión</b><b>${S.ads.length?'Activa':'Pendiente'}</b></span><i style="width:${S.ads.length?42:5}%"></i></div></div></article>`).join('')}</div></section></section>`}
function usuarios(){return `<section><div class="hero"><div><p class="eyebrow">CONTROL DE ACCESO</p><h1>Usuarios y roles</h1><p>Administrador, analistas y público con vistas y permisos diferenciados.</p></div></div><div class="userCards">${USERS.map(u=>`<article class="userCard"><strong>${esc(u.name)}</strong><span>${esc(u.role)}</span><small>${esc(u.email)}</small></article>`).join('')}<article class="userCard"><strong>Público</strong><span>LECTURA</span><small>Solo datos aprobados</small></article></div><div class="notice warn"><b>Siguiente capa de seguridad</b><span>La experiencia de roles ya funciona. Para cuentas reales entre distintas máquinas debemos conectar Supabase Auth + RLS.</span></div></section>`}
function auditoria(){return `<section><div class="hero"><div><p class="eyebrow">TRAZABILIDAD</p><h1>Auditoría de actividad</h1><p>Registro local de acciones de esta sesión: accesos, cargas, asignaciones y revisiones.</p></div>${badge(`${S.audit.length} eventos`,'blue')}</div><section class="panel"><div class="auditList">${S.audit.length?S.audit.map(a=>`<div class="auditItem"><span>${new Date(a.when).toLocaleString('es-PE')}</span><b>${esc(a.user)} · ${esc(a.action)}</b><small>${esc(a.id||'')}</small></div>`).join(''):'<div style="padding:40px;text-align:center;color:#71869e">Aún no hay eventos registrados.</div>'}</div></section></section>`}
function publico(){return `<section><div class="hero"><div><p class="eyebrow">OBSERVATORIO PÚBLICO</p><h1>Publicidad política monitoreada</h1><p>Consulta de información aprobada. Sin edición ni observaciones internas.</p></div></div><div class="metrics">${metric('Partidos analizados','4','Alcance de la investigación')}${metric('Anuncios detectados','1,184','Primera Entrega')}${metric('Periodo','2026','Proceso analizado')}${metric('Fuente','Meta','Biblioteca de anuncios')}</div><section class="panel"><div class="panelHead"><div><p class="kicker">TRANSPARENCIA</p><h2>Comparación por partido</h2></div></div><div class="partyGrid">${PARTIDOS.map(p=>`<article class="party"><div class="partyRow"><b>${esc(p.nombre)}</b><strong>${fmt(p.total)}</strong></div><div class="bar"><i style="width:${Math.round(p.total/611*100)}%"></i></div></article>`).join('')}</div></section></section>`}
function render(){if(!S.session){login();return}if(S.session.role==='PUBLICO')S.page='publico';if(S.session.role==='ANALISTA'&&!['resumen','revision','observados','reportes'].includes(S.page))S.page='resumen';const P={resumen,cargas,asignaciones,revision,observados,reportes,usuarios,auditoria,publico};app.innerHTML=shell((P[S.page]||resumen)());bind()}
function bind(){document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{S.page=b.dataset.page;save();render()});document.getElementById('logout')?.addEventListener('click',()=>{audit('Cierre de sesión');S.session=null;save();render()});document.getElementById('globalSearch')?.addEventListener('input',e=>{S.filters.q=e.target.value;save()});document.querySelectorAll('[data-filter]').forEach(el=>el.addEventListener('change',e=>{S.filters[e.target.dataset.filter]=e.target.value;S.reviewIndex=0;save();render()}));document.querySelector('[data-filter="q"]')?.addEventListener('input',e=>{S.filters.q=e.target.value;S.reviewIndex=0;save();render()});document.getElementById('clear')?.addEventListener('click',()=>{S.filters={...base.filters};S.reviewIndex=0;save();render()});document.getElementById('pick')?.addEventListener('click',e=>{e.stopPropagation();document.getElementById('zip')?.click()});document.getElementById('zip')?.addEventListener('change',e=>e.target.files?.[0]&&loadZip(e.target.files[0]));const dz=document.getElementById('drop');dz?.addEventListener('click',()=>document.getElementById('zip')?.click());dz?.addEventListener('dragover',e=>{e.preventDefault();dz.classList.add('drag')});dz?.addEventListener('dragleave',()=>dz.classList.remove('drag'));dz?.addEventListener('drop',e=>{e.preventDefault();dz.classList.remove('drag');const f=e.dataTransfer.files?.[0];if(f)loadZip(f)});document.getElementById('saveAssign')?.addEventListener('click',()=>{document.querySelectorAll('[data-assign]').forEach(el=>S.assignments[el.dataset.assign]=el.value);audit('Actualizó asignaciones');save();toast('Asignaciones guardadas')});document.getElementById('prev')?.addEventListener('click',()=>{S.reviewIndex=Math.max(0,S.reviewIndex-1);save();render()});document.getElementById('next')?.addEventListener('click',next);document.getElementById('skip')?.addEventListener('click',next);document.querySelectorAll('[data-status]').forEach(b=>b.onclick=()=>reviewSave(b.dataset.status));document.getElementById('csv')?.addEventListener('click',csv)}function next(){const L=list();S.reviewIndex=(S.reviewIndex+1)%Math.max(L.length,1);save();render()}function reviewSave(status){const L=list(),a=L[S.reviewIndex],id=val(a,'IDENTIFICADOR DE LA BIBLIOTECA','ID_BIBLIOTECA','ID Biblioteca');S.reviews[id]={id,estado:status,clasificacion:document.getElementById('classification')?.value||'',mensaje:document.getElementById('message')?.value||'',promueve:document.getElementById('promueve')?.value||'',llamado:document.getElementById('llamado')?.value||'',quality:document.getElementById('quality')?.value||'',motivo:document.getElementById('motivo')?.value||'',observacion:document.getElementById('note')?.value||'',usuario:S.session.name,fecha:new Date().toISOString()};audit(status==='VALIDADO'?'Validó anuncio':'Observó anuncio',id);save();toast(status==='VALIDADO'?'Anuncio validado':'Enviado a observados',status==='VALIDADO'?'ok':'warn');next()}
async function loadZip(file){try{if(!window.JSZip)throw new Error('No se cargó el lector ZIP');const z=await JSZip.loadAsync(file),n=Object.keys(z.files),ap=n.find(x=>x.endsWith('ANUNCIOS_WEB.json')),ep=n.find(x=>x.endsWith('EVIDENCIAS_WEB.json'));if(!ap)throw new Error('No se encontró ANUNCIOS_WEB.json');S.ads=JSON.parse(await z.file(ap).async('string'));S.evidence=ep?JSON.parse(await z.file(ep).async('string')):[];S.importInfo={name:file.name,ads:S.ads.length,evidence:S.evidence.length};S.reviewIndex=0;audit('Importó paquete',file.name);save();toast(`Paquete cargado: ${S.ads.length} anuncios`);render()}catch(e){toast('No se pudo importar: '+(e.message||e),'warn')}}function csv(){const R=Object.values(S.reviews);if(!R.length){toast('Aún no hay revisiones','warn');return}const H=['id','estado','clasificacion','mensaje','promueve','llamado','quality','motivo','observacion','usuario','fecha'],out=[H.join(','),...R.map(r=>H.map(h=>`"${String(r[h]??'').replace(/"/g,'""')}"`).join(','))].join('\n'),blob=new Blob(['\ufeff'+out],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='REVISION_META_VALIDADA.csv';a.click();URL.revokeObjectURL(a.href)}render();
</script>
